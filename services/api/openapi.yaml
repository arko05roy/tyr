openapi: 3.0.3
info:
  title: tyr.bet API
  version: 1.0.0
  description: "Testnet-only. Session auth = signed `tyr_session` cookie from the passkey routes. Agent routes are signed with the agent key (x-tyr-agent / x-tyr-timestamp / x-tyr-signature, EIP-191 over method, path, timestamp, sha256(body)); paid agent routes answer 402 with an MPP challenge. Live events: GET /ws (see WsEvent)."
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: tyr_session
    agent:
      type: apiKey
      in: header
      name: x-tyr-signature
    admin:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          description: machine-readable reason (e.g. limit, balance, region)
        issues:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
            additionalProperties: false
          description: request validation failures
      required:
        - error
      additionalProperties: false
      description: Error
    Order:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        agentSessionId:
          type: string
          nullable: true
        idempotencyKey:
          type: string
          nullable: true
        marketId:
          type: string
          description: venue market id `venue:nativeId`
        hlMarket:
          type: string
          nullable: true
          description: HL outcome id (Hyperliquid orders only)
        routeKey:
          type: string
          nullable: true
          description: shared by the legs of one routed bet
        side:
          type: string
          enum:
            - "yes"
            - "no"
        isBuy:
          type: boolean
        tif:
          type: string
        size:
          type: string
          description: decimal number as a string (exact, from Postgres numeric)
        price:
          type: string
          description: decimal number as a string (exact, from Postgres numeric)
        filledSize:
          type: string
          description: decimal number as a string (exact, from Postgres numeric)
        avgPx:
          type: string
          nullable: true
          description: decimal number as a string (exact, from Postgres numeric)
        stakeUsd:
          type: string
          nullable: true
          description: decimal number as a string (exact, from Postgres numeric)
        stakeSalt:
          type: string
          nullable: true
        builderFee:
          type: string
          nullable: true
          description: HL builder fee, or the venue taker fee on other venues
        hlOid:
          type: string
          nullable: true
        simulated:
          type: boolean
          description: paper fill (HL testnet book) or a simulated venue adapter — no venue ref exists
        execution:
          nullable: true
        status:
          type: string
        step:
          type: string
          description: last completed saga step
        error:
          type: string
          nullable: true
        tempoStakeTx:
          type: string
          nullable: true
        escrowTx:
          type: string
          nullable: true
        solanaOpenTx:
          type: string
          nullable: true
        parentId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        settlement:
          anyOf:
            - $ref: "#/components/schemas/Settlement"
          nullable: true
      required:
        - id
        - userId
        - agentSessionId
        - idempotencyKey
        - marketId
        - hlMarket
        - routeKey
        - side
        - isBuy
        - tif
        - size
        - price
        - filledSize
        - avgPx
        - stakeUsd
        - stakeSalt
        - builderFee
        - hlOid
        - simulated
        - status
        - step
        - error
        - tempoStakeTx
        - escrowTx
        - solanaOpenTx
        - parentId
        - createdAt
        - updatedAt
      additionalProperties: false
    Settlement:
      type: object
      properties:
        orderId:
          type: string
        outcome:
          type: string
        pnl:
          type: string
          description: decimal number as a string (exact, from Postgres numeric)
        payoutUsd:
          type: string
          description: decimal number as a string (exact, from Postgres numeric)
        payoutSalt:
          type: string
          nullable: true
        solanaTx:
          type: string
          nullable: true
        escrowPayTx:
          type: string
          nullable: true
        escrowTopUpTx:
          type: string
          nullable: true
        tempoPayoutTx:
          type: string
          nullable: true
        memoHash:
          type: string
          nullable: true
        closeOrderId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - orderId
        - outcome
        - pnl
        - payoutUsd
        - payoutSalt
        - solanaTx
        - escrowPayTx
        - escrowTopUpTx
        - tempoPayoutTx
        - memoHash
        - closeOrderId
        - createdAt
      additionalProperties: false
    Deposit:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        sourceChain:
          type: string
        sourceTx:
          type: string
        logIndex:
          type: integer
        asset:
          type: string
        amount:
          type: string
          description: USD credited
        rawAmount:
          type: string
          nullable: true
        fxRate:
          type: string
          nullable: true
          description: decimal number as a string (exact, from Postgres numeric)
        fxRound:
          type: string
          nullable: true
        status:
          anyOf:
            - type: string
              enum:
                - confirmed
                - minted
                - credited
            - type: string
        mintTx:
          type: string
          nullable: true
        solanaTx:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        creditedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - userId
        - sourceChain
        - sourceTx
        - logIndex
        - asset
        - amount
        - rawAmount
        - fxRate
        - fxRound
        - status
        - mintTx
        - solanaTx
        - createdAt
        - creditedAt
      additionalProperties: false
    Market:
      type: object
      properties:
        outcome:
          type: integer
        name:
          type: string
        description:
          type: string
        template:
          type: object
          additionalProperties:
            type: string
          nullable: true
        sides:
          type: array
          items:
            type: string
        resolvesAt:
          type: string
          format: date-time
        "yes":
          type: object
          properties:
            coin:
              type: string
            bid:
              type: number
            ask:
              type: number
            mid:
              type: number
          required:
            - coin
            - bid
            - ask
            - mid
          additionalProperties: false
      required:
        - outcome
        - name
        - description
        - template
        - sides
        - resolvesAt
        - "yes"
      additionalProperties: false
    MarketDetail:
      type: object
      properties:
        outcome:
          type: object
          properties:
            outcome:
              type: integer
            name:
              type: string
            description:
              type: string
            sideSpecs:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                required:
                  - name
                additionalProperties: true
            quoteToken:
              type: string
            venue:
              type: string
          required:
            - outcome
            - name
            - description
            - sideSpecs
          additionalProperties: true
        resolvesAt:
          type: string
          format: date-time
          nullable: true
        books:
          type: object
          properties:
            "yes":
              type: object
              properties:
                coin:
                  type: string
                time:
                  type: number
                levels:
                  type: array
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        px:
                          type: string
                        sz:
                          type: string
                        "n":
                          type: number
                      required:
                        - px
                        - sz
                        - "n"
                      additionalProperties: false
                  description: "[bids, asks]"
              required:
                - coin
                - time
                - levels
              additionalProperties: true
            "no":
              type: object
              properties:
                coin:
                  type: string
                time:
                  type: number
                levels:
                  type: array
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        px:
                          type: string
                        sz:
                          type: string
                        "n":
                          type: number
                      required:
                        - px
                        - sz
                        - "n"
                      additionalProperties: false
                  description: "[bids, asks]"
              required:
                - coin
                - time
                - levels
              additionalProperties: true
          required:
            - "yes"
            - "no"
          additionalProperties: false
      required:
        - outcome
        - resolvesAt
        - books
      additionalProperties: false
    UnifiedMarket:
      type: object
      properties:
        id:
          type: string
          description: venue:nativeId
        venue:
          type: string
          enum:
            - hyperliquid
            - polymarket
            - kalshi
            - limitless
        nativeId:
          type: string
        title:
          type: string
        category:
          type: string
          enum:
            - crypto
            - macro
            - finance
            - politics
            - sports
            - culture
            - other
        eventKey:
          type: string
        resolvesAt:
          type: string
          format: date-time
        "yes":
          type: object
          properties:
            bid:
              type: number
            ask:
              type: number
            mid:
              type: number
          required:
            - bid
            - ask
            - mid
          additionalProperties: false
        liquidityUsd:
          type: number
      required:
        - id
        - venue
        - nativeId
        - title
        - category
        - eventKey
        - resolvesAt
        - "yes"
        - liquidityUsd
      additionalProperties: false
    UnifiedEvent:
      type: object
      properties:
        eventKey:
          type: string
        title:
          type: string
        category:
          type: string
          enum:
            - crypto
            - macro
            - finance
            - politics
            - sports
            - culture
            - other
        resolvesAt:
          type: string
          format: date-time
        venues:
          type: array
          items:
            type: object
            properties:
              venue:
                type: string
                enum:
                  - hyperliquid
                  - polymarket
                  - kalshi
                  - limitless
              marketId:
                type: string
              yesBid:
                type: number
              yesAsk:
                type: number
              liquidityUsd:
                type: number
            required:
              - venue
              - marketId
              - yesBid
              - yesAsk
              - liquidityUsd
            additionalProperties: false
        bestYesAsk:
          type: object
          properties:
            venue:
              type: string
              enum:
                - hyperliquid
                - polymarket
                - kalshi
                - limitless
            px:
              type: number
          required:
            - venue
            - px
          additionalProperties: false
        bestNoAsk:
          type: object
          properties:
            venue:
              type: string
              enum:
                - hyperliquid
                - polymarket
                - kalshi
                - limitless
            px:
              type: number
          required:
            - venue
            - px
          additionalProperties: false
        priceGap:
          type: number
      required:
        - eventKey
        - title
        - category
        - resolvesAt
        - venues
        - bestYesAsk
        - bestNoAsk
        - priceGap
      additionalProperties: false
    VenueRoute:
      type: object
      properties:
        eventKey:
          type: string
        side:
          type: string
          enum:
            - "yes"
            - "no"
        stakeUsd:
          type: number
        legs:
          type: array
          items:
            type: object
            properties:
              venue:
                type: string
                enum:
                  - hyperliquid
                  - polymarket
                  - kalshi
                  - limitless
              marketId:
                type: string
              sz:
                type: number
              avgPx:
                type: number
              limitPx:
                type: number
              costUsd:
                type: number
              feeUsd:
                type: number
            required:
              - venue
              - marketId
              - sz
              - avgPx
              - limitPx
              - costUsd
              - feeUsd
            additionalProperties: false
        contracts:
          type: number
        costUsd:
          type: number
        avgAllInPx:
          type: number
        singles:
          type: array
          items:
            type: object
            properties:
              venue:
                type: string
                enum:
                  - hyperliquid
                  - polymarket
                  - kalshi
                  - limitless
              marketId:
                type: string
              contracts:
                type: number
              costUsd:
                type: number
            required:
              - venue
              - marketId
              - contracts
              - costUsd
            additionalProperties: false
        edgeVsWorst:
          type: number
      required:
        - eventKey
        - side
        - stakeUsd
        - legs
        - contracts
        - costUsd
        - avgAllInPx
        - singles
        - edgeVsWorst
      additionalProperties: false
    Hedge:
      type: object
      properties:
        orderId:
          type: string
        userId:
          type: string
        symbol:
          type: string
        stockToken:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        direction:
          type: string
          enum:
            - buy
            - sell
        amountIn:
          type: string
          description: USD debited from the bankroll
        amountOut:
          type: string
          description: stock shares
        entryPx:
          type: string
          description: decimal number as a string (exact, from Postgres numeric)
        exitPx:
          type: string
          nullable: true
          description: decimal number as a string (exact, from Postgres numeric)
        valueUsd:
          type: string
          nullable: true
          description: decimal number as a string (exact, from Postgres numeric)
        priceSource:
          type: string
        priceAt:
          type: string
          format: date-time
        simulated:
          type: boolean
        status:
          type: string
          enum:
            - open
            - closed
        uniswapTx:
          type: string
          nullable: true
        chainlinkRound:
          type: string
          nullable: true
        escrowTx:
          type: string
          nullable: true
        payTx:
          type: string
          nullable: true
        escrowTopUpTx:
          type: string
          nullable: true
        receiptId:
          type: string
          nullable: true
        receiptTx:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - orderId
        - userId
        - symbol
        - stockToken
        - direction
        - amountIn
        - amountOut
        - entryPx
        - exitPx
        - valueUsd
        - priceSource
        - priceAt
        - simulated
        - status
        - uniswapTx
        - chainlinkRound
        - escrowTx
        - payTx
        - escrowTopUpTx
        - receiptId
        - receiptTx
        - createdAt
        - closedAt
      additionalProperties: false
    ReceiptSummary:
      type: object
      properties:
        id:
          type: string
        kind:
          anyOf:
            - type: string
              enum:
                - bet
                - zcash-payout
                - bet+hedge
            - type: string
        subjectId:
          type: string
          nullable: true
        payloadHash:
          type: string
        visibility:
          type: string
          enum:
            - private
            - public
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - kind
        - subjectId
        - payloadHash
        - visibility
        - createdAt
      additionalProperties: false
    Verification:
      type: object
      properties:
        receiptId:
          type: string
        kind:
          type: string
        ok:
          type: boolean
        checks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              ok:
                type: boolean
              detail:
                type: string
            required:
              - name
              - ok
            additionalProperties: false
      required:
        - receiptId
        - kind
        - ok
        - checks
      additionalProperties: false
    Proof:
      type: object
      properties:
        receiptId:
          type: string
        kind:
          type: string
        payloadHash:
          type: string
        provedAt:
          type: string
          format: date-time
        tempo:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              tx:
                type: string
              memo:
                type: string
              explorer:
                type: string
            required:
              - label
              - tx
              - memo
              - explorer
            additionalProperties: false
        solana:
          type: object
          properties:
            settleTx:
              type: string
              nullable: true
            opening:
              type: object
              properties:
                amountUnits:
                  type: string
                salt:
                  type: string
              required:
                - amountUnits
                - salt
              additionalProperties: false
              nullable: true
            attestations:
              type: array
              items:
                type: object
                properties:
                  label:
                    type: string
                  tx:
                    type: string
                  explorer:
                    type: string
                  attestation:
                    type: object
                    properties:
                      statement:
                        type: object
                        properties: {}
                        additionalProperties: true
                    required:
                      - statement
                    additionalProperties: true
                required:
                  - label
                  - tx
                  - explorer
                  - attestation
                additionalProperties: false
          required:
            - settleTx
            - opening
            - attestations
          additionalProperties: false
          nullable: true
        zcash:
          type: object
          properties:
            kind:
              type: string
              enum:
                - zcash-ovk-view+frost
            receiptId:
              type: string
            orderTxid:
              type: string
            payoutTxid:
              type: string
            view:
              type: object
              properties: {}
              additionalProperties: true
              nullable: true
            instruction:
              type: object
              properties: {}
              additionalProperties: true
            frost:
              type: object
              properties:
                signature:
                  type: string
                signers:
                  type: string
                  nullable: true
                verifyingKey:
                  type: string
                threshold:
                  type: string
                valid:
                  type: boolean
              required:
                - signature
                - signers
                - verifyingKey
                - threshold
                - valid
              additionalProperties: false
            matches:
              type: boolean
          required:
            - kind
            - receiptId
            - orderTxid
            - payoutTxid
            - view
            - instruction
            - frost
            - matches
          additionalProperties: false
          nullable: true
      required:
        - receiptId
        - kind
        - payloadHash
        - provedAt
        - tempo
        - solana
        - zcash
      additionalProperties: false
    WsEvent:
      anyOf:
        - type: object
          properties:
            type:
              type: string
              enum:
                - hello
            userId:
              type: string
          required:
            - type
            - userId
          additionalProperties: false
        - type: object
          properties:
            type:
              type: string
              enum:
                - order
            userId:
              type: string
            orderId:
              type: string
            step:
              type: string
            status:
              type: string
          required:
            - type
            - userId
            - orderId
            - step
            - status
          additionalProperties: false
        - type: object
          properties:
            type:
              type: string
              enum:
                - settlement
            userId:
              type: string
            orderId:
              type: string
            outcome:
              type: string
            payoutUsd:
              type: number
          required:
            - type
            - userId
            - orderId
            - outcome
            - payoutUsd
          additionalProperties: false
        - type: object
          properties:
            type:
              type: string
              enum:
                - deposit
            userId:
              type: string
            depositId:
              type: string
            sourceChain:
              type: string
            status:
              type: string
            amountUsd:
              type: number
          required:
            - type
            - userId
            - depositId
            - sourceChain
            - status
            - amountUsd
          additionalProperties: false
      description: Messages pushed on GET /ws (session cookie). Closes 4401 when unauthenticated.
paths:
  /health:
    get:
      tags:
        - meta
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
                additionalProperties: false
  /api/auth/passkey/register/options:
    post:
      tags:
        - auth
      responses:
        "200":
          description: PublicKeyCredential{Creation,Request}OptionsJSON — pass to @simplewebauthn/browser
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge:
                    type: string
                required:
                  - challenge
                additionalProperties: true
                description: PublicKeyCredential{Creation,Request}OptionsJSON — pass to @simplewebauthn/browser
  /api/auth/passkey/register/verify:
    post:
      tags:
        - auth
      description: Verifies the attestation, creates the user, sets the session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                rawId:
                  type: string
                type:
                  type: string
                  enum:
                    - public-key
                response:
                  type: object
                  properties: {}
                  additionalProperties: true
              required:
                - id
                - rawId
                - type
                - response
              additionalProperties: true
              description: RegistrationResponseJSON / AuthenticationResponseJSON from @simplewebauthn/browser
        description: RegistrationResponseJSON / AuthenticationResponseJSON from @simplewebauthn/browser
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  tempoAddress:
                    type: string
                    pattern: ^0x[0-9a-fA-F]{40}$
                required:
                  - userId
                  - tempoAddress
                additionalProperties: false
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/passkey/login/options:
    post:
      tags:
        - auth
      responses:
        "200":
          description: PublicKeyCredential{Creation,Request}OptionsJSON — pass to @simplewebauthn/browser
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge:
                    type: string
                required:
                  - challenge
                additionalProperties: true
                description: PublicKeyCredential{Creation,Request}OptionsJSON — pass to @simplewebauthn/browser
  /api/auth/passkey/login/verify:
    post:
      tags:
        - auth
      description: Verifies the assertion and sets the session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                rawId:
                  type: string
                type:
                  type: string
                  enum:
                    - public-key
                response:
                  type: object
                  properties: {}
                  additionalProperties: true
              required:
                - id
                - rawId
                - type
                - response
              additionalProperties: true
              description: RegistrationResponseJSON / AuthenticationResponseJSON from @simplewebauthn/browser
        description: RegistrationResponseJSON / AuthenticationResponseJSON from @simplewebauthn/browser
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  tempoAddress:
                    type: string
                    pattern: ^0x[0-9a-fA-F]{40}$
                required:
                  - userId
                  - tempoAddress
                additionalProperties: false
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/me:
    get:
      tags:
        - auth
      security:
        - session: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  tempoAddress:
                    type: string
                    pattern: ^0x[0-9a-fA-F]{40}$
                  region:
                    type: string
